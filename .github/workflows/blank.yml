name: Compile AliKernel for Mist OS with KernelSU

on:
  workflow_dispatch:

jobs:
  kernel_compile:
    runs-on: ubuntu-latest
    steps:
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 5120
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'

    - name: Install Compiler Toolchain dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex glibc-source libelf-dev libssl-dev textinfo shadow-utils target-cli-utils xz-utils zip git curl python3

    - name: Clone AliKernel Source Code Tree
      run: |
        git clone --depth=1 ${{ github.server_url }}/${{ github.repository }}.git kernel-source

    - name: Integrate KernelSU Core Backend (Legacy Non-GKI 4.14 Fix)
      run: |
        cd kernel-source
        # Explicitly targets legacy-compatible architecture v0.9.5 via official setup script
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

    - name: Adjust Config for KernelSU and RAM Optimizations
      run: |
        cd kernel-source
        TARGET_DEFCONFIG="RMP6768_defconfig"
        
        # Force-enable KernelSU compilation engine prerequisites
        echo "CONFIG_MODULES=y" >> arch/arm64/configs/$TARGET_DEFCONFIG
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/$TARGET_DEFCONFIG
        echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/$TARGET_DEFCONFIG
        echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/$TARGET_DEFCONFIG
        
        # RAM Optimization Configurations: Expanding Swapping/ZRAM Targets for extra active capacity
        echo "CONFIG_ZRAM=y" >> arch/arm64/configs/$TARGET_DEFCONFIG
        echo "CONFIG_ZRAM_WRITEBACK=y" >> arch/arm64/configs/$TARGET_DEFCONFIG
        echo "CONFIG_CLEANCACHE=y" >> arch/arm64/configs/$TARGET_DEFCONFIG
        echo "CONFIG_FRONTSWAP=y" >> arch/arm64/configs/$TARGET_DEFCONFIG

    - name: Fetch Proton-Clang Compilation Toolchain
      run: |
        git clone --depth=1 https://github.com toolchain

    - name: Run Build Compilation
      run: |
        export PATH=$(pwd)/toolchain/bin:$PATH
        cd kernel-source
        
        # Execute structural composition flags using Proton compiler mappings
        make O=out ARCH=arm64 RMP6768_defconfig
        make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CC=clang

    - name: Package and Upload Flashable Build
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-RAM-Optimized-Kernel
        path: kernel-source/out/arch/arm64/boot/Image.gz-dtb
